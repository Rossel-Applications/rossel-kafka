services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  _instanceof:
    Rossel\RosselKafka\Consumer\ConsumerInterface:
      tags: ['rossel_kafka.consumer']

  Rossel\RosselKafka\:
    resource: '../../../src/'
    exclude:
      - '../../../src/DependencyInjection/'
      - '../../../src/Entity/'
      - '../../../src/Model/'
      - '../../../src/Enum/'
      - '../../../src/Exception/'
      - '../../../src/RosselKafkaPhpKitBundle.php'

  Rossel\RosselKafka\Service\Connector\KafkaConnector:
    arguments:
      $brokerUrl: '%rossel_kafka.broker.url%'
      $appName: '%rossel_kafka.producer.app_name%'
      $saslUsername: '%rossel_kafka.broker.authentication.sasl_username%'
      $saslPassword: '%rossel_kafka.broker.authentication.sasl_password%'
      $saslMechanism: '%rossel_kafka.broker.authentication.sasl_mechanism%'
      $sslCaCertificateUrl: '%rossel_kafka.broker.authentication.ssl_ca_certificate_url%'
      $sslCaCertificatePath: '%rossel_kafka.broker.authentication.ssl_ca_certificate_path%'
      $sslClientCertificate: '%rossel_kafka.broker.authentication.ssl_client_certificate%'
      $sslClientKey: '%rossel_kafka.broker.authentication.ssl_client_key%'
      $sslClientKeyPassword: '%rossel_kafka.broker.authentication.ssl_client_key_password%'

  Rossel\RosselKafka\Service\KafkaTopicsFetcher:
    arguments:
      $topics: '%rossel_kafka.broker.topics%'

  Rossel\RosselKafka\Orchestrator\ConsumptionOrchestrator:
    $consumers: !tagged_iterator 'rossel_kafka.consumer'
    $appName: '%rossel_kafka.producer.app_name%'
