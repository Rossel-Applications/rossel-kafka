rossel_kafka:
    producer:
        app_name: '%env(ROSSEL_KAFKA_PRODUCER_APP_NAME)%'

    broker:
        url: '%env(ROSSEL_KAFKA_BROKER_URL)%'

        authentication:
            # SASL authentication (optional — leave unset for unauthenticated connections)
            sasl_username: '%env(default::ROSSEL_KAFKA_BROKER_SASL_USERNAME)%'
            sasl_password: '%env(default::ROSSEL_KAFKA_BROKER_SASL_PASSWORD)%'
            sasl_mechanism: '%env(default::ROSSEL_KAFKA_BROKER_SASL_MECHANISM)%'

            # SSL CA certificate (optional — provide url OR path, path takes priority)
            ssl_ca_certificate_url: '%env(default::ROSSEL_KAFKA_BROKER_SSL_CA_CERTIFICATE_URL)%'
            ssl_ca_certificate_path: '%env(default::ROSSEL_KAFKA_BROKER_SSL_CA_CERTIFICATE_PATH)%'

            # mTLS client certificate (optional — PEM content or file path)
            ssl_client_certificate: '%env(default::ROSSEL_KAFKA_BROKER_SSL_CLIENT_CERTIFICATE)%'
            ssl_client_key: '%env(default::ROSSEL_KAFKA_BROKER_SSL_CLIENT_KEY)%'
            ssl_client_key_password: '%env(default::ROSSEL_KAFKA_BROKER_SSL_CLIENT_KEY_PASSWORD)%'

        # rdkafka debug contexts (optional — disabled by default)
        # accepted values: generic, broker, topic, metadata, feature, queue, msg, protocol, cgrp, security, fetch, interceptor, plugin, consumer, admin, eos, mock, assignor, conf, telemetry, all
        debug: '%env(default::ROSSEL_KAFKA_BROKER_DEBUG)%'

        topics:
            account_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_ACCOUNT_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            authentication_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_AUTHENTICATION_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_dead_letter_inout_v1_json_delete_d30: '%env(default::KAFKA_TOPIC_PUBLIC_DEAD_LETTER_INOUT_V1_JSON_DELETE_D30)%'
            erp_subscription_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_ERP_SUBSCRIPTION_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_inheritance_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_INHERITANCE_OUTPUT_V1_JSON_DELETE)%'
            inheritance_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_INHERITANCE_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            notification_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_NOTIFICATION_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_notification_input_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_NOTIFICATION_INPUT_V1_JSON_DELETE)%'
            offer_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_OFFER_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_offer_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_OFFER_OUTPUT_V1_JSON_DELETE)%'
            profile_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PROFILE_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            purchase_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PURCHASE_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_offer_input_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_OFFER_INPUT_V1_JSON_DELETE)%'
            public_subscription_input_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_SUBSCRIPTION_INPUT_V1_JSON_DELETE)%'
            public_subscription_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_SUBSCRIPTION_OUTPUT_V1_JSON_DELETE)%'
            public_contact_input_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_CONTACT_INPUT_V1_JSON_DELETE)%'
            input_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_INPUT_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            output_api_public_log_output_v1_json_delete: '%env(default::KAFKA_TOPIC_OUTPUT_API_PUBLIC_LOG_OUTPUT_V1_JSON_DELETE)%'
            public_profile_output_v1_json_delete: '%env(default::KAFKA_TOPIC_PUBLIC_PROFILE_OUTPUT_V1_JSON_DELETE)%'
